[project]
name = "autopoietic-agent"
version = "0.2.0"
description = "A self-propagating Model Context Protocol layer with TDD and semantic search"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # MCP server and LLM
    "fastmcp>=2.0.0",
    "anthropic>=0.18.0",

    # Configuration / validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # Semantic memory (vector store). Embeddings fall back to a deterministic
    # hash embedding when sentence-transformers is not installed.
    "chromadb>=0.4.22",

    # Hot-reload of generated tools
    "watchdog>=4.0.0",

    # The sandbox runs generated tests with pytest, so it is a runtime dependency
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
]

[project.optional-dependencies]
# Real semantic embeddings + BM25 keyword matching (heavy: pulls in torch)
semantic = [
    "sentence-transformers>=2.3.0",
    "rank-bm25>=0.2.2",
]

# Kept for backwards compatibility; watchdog is now a core dependency
hotreload = [
    "watchdog>=4.0.0",
]

# Docker sandbox (SANDBOX_TYPE=docker)
docker = [
    "docker>=7.0.0",
]

# Development tools
dev = [
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

# Everything
all = [
    "autopoietic-agent[semantic,docker,dev]",
]

[project.scripts]
autopoietic = "src.orchestrator:main"
weave = "src.orchestrator:main"

[project.urls]
Homepage = "https://github.com/yourusername/autopoietic-agent"
Documentation = "https://github.com/yourusername/autopoietic-agent/blob/main/README.md"
Repository = "https://github.com/yourusername/autopoietic-agent"
Issues = "https://github.com/yourusername/autopoietic-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    # Coverage is opt-in: pytest --cov=src --cov-report=term-missing
]
markers = [
    "live: needs the live Anthropic API and ANTHROPIC_API_KEY (deselect with -m 'not live')",
    "docker: needs a running Docker daemon (deselect with -m 'not docker')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
timeout = 300

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "rank_bm25.*",
    "watchdog.*",
    "docker.*",
    "prometheus_client.*",
]
ignore_missing_imports = true
